<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Drive - My Files</title>
    <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        :root {
            --bg: #050505;
            --side: #0f0f0f;
            --text: #ffffff;
            --accent: #ff0055;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            overflow: hidden;
        }

        #sidebar {
            width: 70px;
            background-color: var(--side);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid #222;
        }

        .dock-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.7;
        }

        .dock-icon:hover {
            opacity: 1;
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px var(--accent));
        }

        #main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        #top-nav {
            padding: 10px 15px;
            background: #000;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #222;
        }

        #url-input {
            flex-grow: 1;
            background: #111;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px 15px;
            border-radius: 4px;
            outline: none;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #browser-view {
            flex-grow: 1;
            border: none;
            background: white;
            width: 100%;
        }

        .panic-btn {
            margin-top: auto;
            cursor: pointer;
            font-size: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=google.com&sz=64" onclick="launch('https://www.google.com')">
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=discord.com&sz=64" onclick="launch('https://discord.com')">
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=reddit.com&sz=64" onclick="launch('https://www.reddit.com')">
        <div class="panic-btn" onclick="panic()">🏠</div>
    </div>

    <div id="main-container">
        <div id="top-nav">
            <input type="text" id="url-input" placeholder="Enter URL (e.g. discord.com)">
            <button class="btn" onclick="handleInput()">Go</button>
        </div>
        <iframe id="browser-view" src="about:blank"></iframe>
    </div>

    <script>
        const frame = document.getElementById('browser-view');
        const input = document.getElementById('url-input');

        // YOUR REPLIT URL
        const engineURL = "https://dc14316e-8fdc-4cbc-8179-5f781cb2a282-00-36ss2kfp7vp8j.kirk.replit.dev/";

        function launch(target) {
            // This builds the final link: Engine + Target Website
            // Example: https://replit-link.com/?url=https://discord.com
            const finalURL = engineURL + "?url=" + encodeURIComponent(target);
            console.log("Routing to:", finalURL);
            frame.src = finalURL;
        }

        function handleInput() {
            let val = input.value.trim();
            if (!val) return;
            if (!val.startsWith('http')) val = 'https://' + val;
            launch(val);
        }

        function panic() {
            window.location.href = "https://classroom.google.com";
        }

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") handleInput(); });

        // Default start page
        window.onload = () => launch('https://www.google.com');
    </script>
</body>
</html>
