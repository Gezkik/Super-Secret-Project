<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Drive - My Files</title>
    <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        :root {
            --bg: #050505;
            --side: #0f0f0f;
            --text: #ffffff;
            --accent: #ff0055;
            --icon-color: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar - Fixed Width */
        #sidebar {
            width: 70px;
            min-width: 70px;
            background-color: var(--side);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid #222;
            height: 100vh;
        }

        .dock-icon {
            width: 28px; height: 28px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s;
            filter: drop-shadow(0 0 5px var(--accent));
        }

        /* Main Container - Fills the rest of the screen */
        #main-container {
            flex: 1; /* This fixes the small window in image_cbe302.png */
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #000;
        }

        /* Tab Bar */
        #tab-bar {
            display: flex;
            background: #111;
            padding: 5px 10px 0 10px;
            gap: 5px;
            border-bottom: 1px solid #222;
            overflow-x: auto;
        }

        .tab {
            background: #222;
            color: #888;
            padding: 8px 15px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            min-width: 100px;
        }

        .tab.active {
            background: var(--side);
            color: var(--text);
            border: 1px solid var(--accent);
            border-bottom: none;
        }

        .close-tab {
            font-size: 14px;
            opacity: 0.5;
        }

        .close-tab:hover { color: var(--accent); opacity: 1; }

        #add-tab {
            padding: 5px 10px;
            cursor: pointer;
            color: var(--accent);
            font-weight: bold;
        }

        /* Top Nav */
        #top-nav {
            padding: 10px 15px;
            background: var(--side);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #url-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px 15px;
            border-radius: 20px;
            outline: none;
        }

        .btn {
            background: var(--accent);
            color: var(--icon-color);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Browser Frame Area */
        #browser-container {
            flex: 1;
            position: relative;
        }

        .browser-frame {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            background: white;
            display: none;
        }

        .browser-frame.active { display: block; }

        .controls { margin-top: auto; display: flex; flex-direction: column; gap: 20px; align-items: center; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <img class="dock-icon" src="https://img.icons8.com/ios-filled/50/ffffff/search.png" onclick="createNewTab('https://www.google.com')">
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=discord.com&sz=64" onclick="createNewTab('https://discord.com')">
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=spotify.com&sz=64" onclick="createNewTab('https://open.spotify.com')">
        
        <div class="controls">
            <input type="color" id="colorPicker" onchange="updateTheme(this.value)" style="width:25px; height:25px; border:none; background:none; cursor:pointer;">
            <div style="cursor:pointer; opacity:0.3;" onclick="panic()">🏠</div>
        </div>
    </div>

    <div id="main-container">
        <div id="tab-bar">
            <div id="tabs-list" style="display:flex; gap:5px;"></div>
            <div id="add-tab" onclick="createNewTab('https://www.google.com')">+</div>
        </div>
        <div id="top-nav">
            <input type="text" id="url-input" placeholder="Search or enter URL...">
            <button class="btn" id="goBtn" onclick="handleInput()">Go</button>
        </div>
        <div id="browser-container" id="frames-list">
            <!-- IFRAMES WILL BE GENERATED HERE -->
        </div>
    </div>

    <script>
        const tabsList = document.getElementById('tabs-list');
        const browserContainer = document.getElementById('browser-container');
        const urlInput = document.getElementById('url-input');
        const engineURL = "https://dc14316e-8fdc-4cbc-8179-5f781cb2a282-00-36ss2kfp7vp8j.kirk.replit.dev/";
        
        let tabCount = 0;

        function createNewTab(url) {
            tabCount++;
            const tabId = `tab-${tabCount}`;
            
            // Create Tab Element
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.id = `btn-${tabId}`;
            tab.innerHTML = `<span>New Tab</span> <span class="close-tab" onclick="closeTab(event, '${tabId}')">×</span>`;
            tab.onclick = () => switchTab(tabId);
            tabsList.appendChild(tab);

            // Create Iframe Element
            const iframe = document.createElement('iframe');
            iframe.className = 'browser-frame';
            iframe.id = tabId;
            browserContainer.appendChild(iframe);

            switchTab(tabId);
            loadUrl(tabId, url);
        }

        function loadUrl(tabId, url) {
            if (!url.startsWith('http')) url = 'https://' + url;
            const finalURL = engineURL + "?url=" + encodeURIComponent(url);
            document.getElementById(tabId).src = finalURL;
            
            // Update tab title (simplified)
            document.getElementById(`btn-${tabId}`).querySelector('span').innerText = url.split('/')[2] || "New Tab";
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.browser-frame').forEach(f => f.classList.remove('active'));
            
            document.getElementById(`btn-${tabId}`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            // Update address bar to match active tab's source (approximate)
            urlInput.value = ""; 
        }

        function closeTab(e, tabId) {
            e.stopPropagation();
            document.getElementById(`btn-${tabId}`).remove();
            document.getElementById(tabId).remove();
            if (document.querySelectorAll('.tab').length > 0) {
                const firstTab = document.querySelector('.tab').id.replace('btn-', '');
                switchTab(firstTab);
            }
        }

        function handleInput() {
            const activeFrame = document.querySelector('.browser-frame.active');
            if (activeFrame) loadUrl(activeFrame.id, urlInput.value);
        }

        function updateTheme(color) {
            document.documentElement.style.setProperty('--accent', color);
            const r = parseInt(color.substr(1,2), 16), g = parseInt(color.substr(3,2), 16), b = parseInt(color.substr(5,2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            document.documentElement.style.setProperty('--icon-color', brightness > 125 ? '#000' : '#fff');
        }

        function panic() { window.location.href = "https://classroom.google.com"; }
        urlInput.addEventListener("keypress", (e) => { if (e.key === "Enter") handleInput(); });

        // Start with one tab
        window.onload = () => createNewTab('https://www.google.com');
    </script>
</body>
</html>
