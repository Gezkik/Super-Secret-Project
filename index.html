<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Drive - My Files</title>
    <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        :root {
            --bg: #050505;
            --side: #0f0f0f;
            --text: #ffffff;
            --accent: #ff0055;
            --icon-color: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Fixes */
        #sidebar {
            width: 70px;
            min-width: 70px;
            background-color: var(--side);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid #222;
            height: 100vh;
            z-index: 100;
        }

        .dock-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s;
            filter: drop-shadow(0 0 5px var(--accent));
        }

        .dock-icon:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 0 15px var(--accent));
        }

        /* Browser Switcher Menu */
        #browser-menu {
            position: absolute;
            left: 80px;
            top: 20px;
            background: var(--side);
            border: 1px solid var(--accent);
            padding: 10px;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 200;
        }

        #browser-menu button {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 4px;
        }

        #browser-menu button:hover {
            background: var(--accent);
        }

        /* Main View Container */
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #top-nav {
            padding: 10px 15px;
            background: #000;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #222;
        }

        #url-input {
            flex-grow: 1;
            background: #111;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px 15px;
            border-radius: 4px;
            outline: none;
        }

        .btn {
            background: var(--accent);
            color: var(--icon-color);
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #browser-view {
            flex: 1;
            border: none;
            background: white;
            width: 100%;
        }

        .controls {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <!-- Search/Switcher Icon -->
        <img class="dock-icon" src="https://img.icons8.com/ios-filled/50/ffffff/search.png" id="search-trigger" onclick="toggleMenu()" title="Switch Browser">
        
        <div id="browser-menu">
            <button onclick="launch('https://www.google.com')">Google</button>
            <button onclick="launch('https://www.bing.com')">Bing</button>
            <button onclick="launch('https://duckduckgo.com')">DuckDuckGo</button>
        </div>

        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=discord.com&sz=64" onclick="launch('https://discord.com')">
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=reddit.com&sz=64" onclick="launch('https://reddit.com')">
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=spotify.com&sz=64" onclick="launch('https://open.spotify.com')">
        
        <div class="controls">
            <input type="color" id="colorPicker" onchange="updateTheme(this.value)" style="width:30px; height:30px; border:none; background:none; cursor:pointer;">
            <div style="cursor:pointer; opacity:0.5;" onclick="panic()">🏠</div>
        </div>
    </div>

    <div id="main-container">
        <div id="top-nav">
            <input type="text" id="url-input" placeholder="Enter URL...">
            <button class="btn" id="goBtn" onclick="handleInput()">Go</button>
        </div>
        <iframe id="browser-view" src="about:blank"></iframe>
    </div>

    <script>
        const frame = document.getElementById('browser-view');
        const input = document.getElementById('url-input');
        const menu = document.getElementById('browser-menu');

        // REPLIT ENGINE URL
        const engineURL = "https://dc14316e-8fdc-4cbc-8179-5f781cb2a282-00-36ss2kfp7vp8j.kirk.replit.dev/";

        function toggleMenu() {
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function launch(target) {
            menu.style.display = 'none';
            const finalURL = engineURL + "?url=" + encodeURIComponent(target);
            frame.src = finalURL;
        }

        function handleInput() {
            let val = input.value.trim();
            if (!val) return;
            if (!val.startsWith('http')) val = 'https://' + val;
            launch(val);
        }

        function updateTheme(color) {
            document.documentElement.style.setProperty('--accent', color);
            
            // LUMINANCE CHECK: If color is light, make text black
            const r = parseInt(color.substr(1,2), 16);
            const g = parseInt(color.substr(3,2), 16);
            const b = parseInt(color.substr(5,2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            
            const textColor = brightness > 125 ? '#000000' : '#ffffff';
            document.documentElement.style.setProperty('--icon-color', textColor);
            document.getElementById('goBtn').style.color = textColor;
            
            // Update search icon color
            const searchIcon = document.getElementById('search-trigger');
            searchIcon.src = brightness > 125 
                ? "https://img.icons8.com/ios-filled/50/000000/search.png" 
                : "https://img.icons8.com/ios-filled/50/ffffff/search.png";
        }

        function panic() { window.location.href = "https://classroom.google.com"; }
        input.addEventListener("keypress", (e) => { if (e.key === "Enter") handleInput(); });

        window.onload = () => launch('https://www.google.com');
    </script>
</body>
</html>
