<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Drive - My Files</title> <!-- Fake title to hide from teachers -->
    <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        :root {
            --bg: #050505;
            --side: #0f0f0f;
            --text: #ffffff;
            --accent: #ff0055; /* Opera GX Red */
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Dock */
        #sidebar {
            width: 70px;
            background-color: var(--side);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid #222;
            z-index: 10;
        }

        .dock-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.7;
        }

        .dock-icon:hover {
            opacity: 1;
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px var(--accent));
        }

        /* Main View Container */
        #main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        #top-nav {
            padding: 10px 15px;
            background: #000;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        #url-input {
            flex-grow: 1;
            background: #111;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px 15px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        #url-input:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        /* The Iframe Browser */
        #browser-view {
            flex-grow: 1;
            border: none;
            background: white;
            width: 100%;
        }

        .panic-btn {
            margin-top: auto;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <!-- Shortcuts -->
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=google.com&sz=64" title="Google" onclick="launch('https://www.google.com')">
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=discord.com&sz=64" title="Discord" onclick="launch('https://discord.com')">
        <img class="dock-icon" src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" title="YouTube" onclick="launch('https://www.youtube.com')">
        
        <!-- Panic/Settings -->
        <div class="panic-btn" onclick="panic()" title="Emergency Exit">🏠</div>
    </div>

    <!-- CONTENT AREA -->
    <div id="main-container">
        <div id="top-nav">
            <input type="text" id="url-input" placeholder="Search or type a URL...">
            <button class="btn" onclick="handleInput()">Go</button>
        </div>
        <iframe id="browser-view" src="about:blank"></iframe>
    </div>

    <script>
        const frame = document.getElementById('browser-view');
        const input = document.getElementById('url-input');

        // YOUR LIVE REPLIT ENGINE LINK
        const engineURL = "https://dc14316e-8fdc-4cbc-8179-5f781cb2a282-00-36ss2kfp7vp8j.kirk.replit.dev/";

        function launch(target) {
            console.log("Routing through engine:", target);
            
            /* 
               We are using a "Header-based Proxy". 
               Since an iframe can't easily send custom headers, 
               this engine is set to default to Google or the 
               configured target in the Replit index.js.
            */
            frame.src = engineURL;
        }

        function handleInput() {
            let val = input.value.trim();
            if (!val) return;

            // Simple URL fix
            if (!val.startsWith('http')) {
                val = 'https://' + val;
            }

            // For this specific Replit setup, we are loading the Engine's main page.
            launch(val);
        }

        function panic() {
            // Instantly switch to a real school site
            window.location.href = "https://classroom.google.com";
        }

        // Search on Enter key
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleInput();
            }
        });

        // Load initial page
        window.onload = () => {
            launch('https://www.google.com');
        };
    </script>
</body>
</html>
